name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: "stable"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Build Linux
        run: flutter build linux --release --dart-define=ENV=prod
      - name: Package Linux
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../TicketVentasPrint-Linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: TicketVentasPrint-Linux.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: "stable"
      - name: Build macOS
        run: flutter build macos --release --dart-define=ENV=prod
      - name: Package macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../TicketVentasPrint-Mac.zip "ticketventas_print.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: TicketVentasPrint-Mac.zip

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
      - uses: actions/download-artifact@v4
        with:
          name: macos-build
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            TicketVentasPrint-Linux.tar.gz
            TicketVentasPrint-Mac.zip
          body: |
            Ticket Ventas Print - Agente de impresión silenciosa

            Compatible con impresoras Epson.

            - **Linux**: Descomprimir y ejecutar `./ticketventas_print`
            - **macOS**: Descomprimir y mover a Aplicaciones
