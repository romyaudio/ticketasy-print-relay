name: Build Mac & Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: "stable"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libayatana-appindicator3-dev
      - name: Get dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release --dart-define=ENV=prod
      - name: Package Linux
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../TicketVentasPrint-Linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: TicketVentasPrint-Linux.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: "stable"
      - name: Get dependencies
        run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release --dart-define=ENV=prod
      - name: Package macOS
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../TicketVentasPrint-Mac.zip "ticketventas_print.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: TicketVentasPrint-Mac.zip

  upload-to-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
      - uses: actions/download-artifact@v4
        with:
          name: macos-build
      - name: Upload to existing release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TicketVentasPrint-Linux.tar.gz
            TicketVentasPrint-Mac.zip
          append_body: true
          body: |
            ---
            ### Mac & Linux
            - **macOS**: Descomprimir y mover a Aplicaciones
            - **Linux**: Descomprimir y ejecutar `./ticketventas_print`
      - name: Upload to latest release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $(gh release list --limit 1 --json tagName -q '.[0].tagName') \
            TicketVentasPrint-Linux.tar.gz \
            TicketVentasPrint-Mac.zip \
            --clobber
